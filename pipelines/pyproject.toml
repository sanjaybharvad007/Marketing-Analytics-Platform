[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "map-pipelines"
version = "1.0.0"
description = "Data pipelines, audits and content automation for the Marketing Analytics Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary,pool]>=3.2,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "typer>=0.15,<1",
    "rich>=13.9",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
google = [
    "google-analytics-data>=0.18",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
map = "map_pipelines.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/map_pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a PostgreSQL database (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PT", "RUF"]
ignore = [
    "B008",    # typer.Option(...) in argument defaults is the framework's idiom
    "SIM905",  # word lists read better as a split string than as a long list literal
]

[tool.ruff.lint.isort]
known-first-party = ["map_pipelines"]

[tool.ruff.lint.per-file-ignores]
# SQL and HTML literals in tests are clearer on one line.
"tests/**" = ["E501"]
