name: Nightly pipelines

# Loads the last three days from the live sources, then files new
# opportunities. Three days are re-pulled because Search Console and GA4 keep
# revising recent data. A pipeline whose source is not configured fails on its
# own, is recorded in pipeline_runs, and does not stop the others.
#
# The schedule only runs once the repository variable PIPELINES_ENABLED is set
# to "true"; until then the job is skipped, so a fresh fork does not fail every
# night. Manual runs from the Actions tab always run and default to demo mode.
#
# Secrets used in live mode:
#   DATABASE_URL                 the shared PostgreSQL database
#   GA4_PROPERTY_ID              numeric GA4 property ID
#   GSC_SITE_URL                 Search Console property, e.g. sc-domain:example.com
#   GOOGLE_SERVICE_ACCOUNT_JSON  service-account key with access to both
#   API_BASE_URL, API_TOKEN      where the web app's REST API is reachable
#   AI_ENGINE_*                  optional answer-engine keys and models

on:
  schedule:
    - cron: "30 5 * * *" # 05:30 UTC, after Search Console has yesterday's data
  workflow_dispatch:
    inputs:
      mode:
        description: demo generates data, live calls the source APIs
        type: choice
        options: [demo, live]
        default: demo
      days:
        description: Trailing days to reload
        type: number
        default: 3

concurrency:
  group: nightly-pipelines
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'live' }}
      DAYS: ${{ inputs.days || 3 }}
      # The SEO pipeline reads CSV exports from disk, so it is left out here and
      # run wherever those files are. Override with the PIPELINES variable.
      PIPELINES: ${{ vars.PIPELINES || 'ga4 gsc ai-visibility' }}
      LOG_FORMAT: json
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      AI_ENGINE_CHATGPT_API_KEY: ${{ secrets.AI_ENGINE_CHATGPT_API_KEY }}
      AI_ENGINE_CHATGPT_MODEL: ${{ vars.AI_ENGINE_CHATGPT_MODEL }}
      AI_ENGINE_PERPLEXITY_API_KEY: ${{ secrets.AI_ENGINE_PERPLEXITY_API_KEY }}
      AI_ENGINE_PERPLEXITY_MODEL: ${{ vars.AI_ENGINE_PERPLEXITY_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipelines/pyproject.toml
      - name: Install
        run: pip install -e "pipelines[google]"
      - name: Write the Google service-account key
        if: env.MODE == 'live'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          key_file="$RUNNER_TEMP/google-service-account.json"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$key_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_file" >> "$GITHUB_ENV"
      - name: Apply migrations
        run: map migrate
      - name: Run pipelines
        run: |
          status=0
          for pipeline in $PIPELINES; do
            map run "$pipeline" --mode "$MODE" --days "$DAYS" || status=1
          done
          exit "$status"
      - name: File new opportunities
        if: env.API_BASE_URL != '' && env.API_TOKEN != ''
        run: map opportunities
      - name: Report freshness
        if: always()
        run: map status
